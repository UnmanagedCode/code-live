<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Live</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="statusbar">
    <h1>Code Live</h1>
    <span id="state" class="pill" data-state="idle">idle</span>
    <span id="host" class="pill" data-state="off">Host disconnected</span>
  </header>
  <section class="controls">
    <label>Model <select id="model" aria-label="Gemini model"></select></label>
    <button id="connect" type="button">Connect</button>
    <button id="disconnect" type="button" class="secondary" disabled>Disconnect</button>
  </section>
  <section id="target" class="controls"></section>
  <main id="transcript" class="transcript" aria-live="polite"></main>
  <details class="settings-pane">
    <summary>Settings</summary>
    <div id="settings"></div>
  </details>
</body>
</html>
